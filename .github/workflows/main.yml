name: VPSon:
  workflow_dispatch:

jobs:
  secure-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core SSH Settings
        run: |
          echo "=== Configure VPS for SSH (port 22) ==="
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server ufw curl gnupg lsb-release
          sudo mkdir -p /var/run/sshd
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak || true
          sudo sed -i 's/^#\?Port .*/Port 22/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

      - name: Create SSH User with Static Password
        env:
          SSH_USER: TOOLBOXLAP
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          USER="${SSH_USER:-TOOLBOXLAP}"
          PASS="${SSH_PASS:-admin@123}"
          echo "Creating user: $USER"
          if ! id -u "$USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USER"
            sudo usermod -aG sudo "$USER"
          fi
          echo "${USER}:${PASS}" | sudo chpasswd
          sudo chage -M -1 "$USER" || true
          echo "SSH_USER=${USER}" >> $GITHUB_ENV
          echo "SSH_PASS_SET=1" >> $GITHUB_ENV
          echo "User ${USER} created/ensured."

      - name: Open Firewall Port 22 (UFW)
        run: |
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Restart sshd
        run: |
          sudo systemctl restart ssh || sudo service ssh restart
          sleep 2
          sudo systemctl status ssh --no-pager || sudo service ssh status

      - name: Install Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -sc).noarmor.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          curl -fsSL https://pkgs.tailscale.com/stable/gpg.key | sudo apt-key add -
          sudo apt-get update -y
          sudo apt-get install -y tailscale
          sudo systemctl enable --now tailscaled

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          TS_IP=""
          for i in {1..10}; do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
            if [ -n "$TS_IP" ]; then break; fi
            sleep 5
          done
          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP not assigned"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify SSH Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          ss -tlnp | grep ':22 ' || true
          echo "Check connectivity from your Termux device via Tailscale"

      - name: Maintain Connection
        run: |
          echo "=== SSH ACCESS INFO ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: TOOLBOXLAP"
          echo "Password: (set in secret SSH_PASSWORD or default admin@123)"
          echo "======================="
          while true; do
            echo "[$(date)] VPS Active - use Ctrl+C in workflow to terminate"
            sleep 300
          done
