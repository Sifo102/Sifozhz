#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
Sifo Telegram bot — VPS-ready full version.
يشغل نفسه كخادم، يستقبل ملفات .py، يشغلها، يوقفها، ويعيد تشغيلها تلقائياً.
"""

import os, sys, time, json, threading, subprocess, signal, traceback
from urllib import request, parse

# ========= إعداد التوكن =========
# ⚠️ ضع توكن بوتك هنا بين علامتي التنصيص ↓↓↓
TOKEN = "8407863189:AAFymLb1zhM4Gq2q7YSIKhV5M37K8eTunRk"
# =================================
if not TOKEN:
    print("❌ لم يتم تحديد التوكن. أضفه داخل الكود أو في متغير بيئي TELEGRAM_TOKEN.")
    sys.exit(1)

BASE = f"https://api.telegram.org/bot{TOKEN}"
GETUPDATES = BASE + "/getUpdates"
SENDMSG = BASE + "/sendMessage"
GETFILE = BASE + "/getFile"

APP_DIR = os.path.abspath(os.path.dirname(__file__))
UPLOAD_FOLDER = os.path.join(APP_DIR, "telegram_bot_files")
os.makedirs(UPLOAD_FOLDER, exist_ok=True)
OFFSET_FILE = os.path.join(APP_DIR, ".offset")
LONG_POLL = 15

active_processes = {}
file_status = {}
process_outputs = {}

# ========= تثبيت requests إن لزم =========
def ensure_requests():
    try:
        import requests
        return requests
    except Exception:
        print("📦 تثبيت مكتبة requests ...")
        subprocess.check_call([sys.executable, "-m", "pip", "install", "requests"])
        import requests
        return requests
requests = ensure_requests()

# ========= إرسال رسالة =========
def send(chat_id, text):
    try:
        data = {"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}
        requests.post(SENDMSG, data=data, timeout=10)
    except Exception as e:
        print("send error:", e)

# ========= حفظ/قراءة offset =========
def read_offset():
    try:
        if os.path.exists(OFFSET_FILE):
            return int(open(OFFSET_FILE).read().strip())
    except: pass
def write_offset(v):
    try: open(OFFSET_FILE,"w").write(str(v))
    except: pass

# ========= تحميل الملفات =========
def download_file(file_id, file_name):
    try:
        info = requests.get(f"{GETFILE}?file_id={file_id}", timeout=10).json()
        path = info["result"]["file_path"]
        url = f"https://api.telegram.org/file/bot{TOKEN}/{path}"
        data = requests.get(url, timeout=20).content
        open(os.path.join(UPLOAD_FOLDER,file_name),"wb").write(data)
        return True
    except Exception as e:
        print("download error:", e)
        return False

# ========= تشغيل ملفات بايثون =========
def run_python_file(filename, chat_id):
    fp = os.path.join(UPLOAD_FOLDER, filename)
    if not os.path.exists(fp):
        send(chat_id, f"❌ الملف `{filename}` غير موجود")
        return
    if filename in active_processes:
        stop_file(filename)
    proc = subprocess.Popen([sys.executable, "-u", fp],
                             stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                             text=True, bufsize=1)
    active_processes[filename] = proc
    file_status[filename] = {"status":"running","start":time.time(),"restart":0}
    threading.Thread(target=monitor_proc, args=(filename,chat_id),daemon=True).start()
    send(chat_id, f"✅ تم تشغيل `{filename}` (PID {proc.pid})")

def stop_file(filename):
    if filename not in active_processes:
        return
    proc = active_processes.pop(filename)
    file_status[filename]["status"] = "stopped"
    proc.terminate()
    try: proc.wait(timeout=3)
    except: proc.kill()

def monitor_proc(filename, chat_id):
    proc = active_processes[filename]
    while True:
        line = proc.stdout.readline()
        if line:
            process_outputs[filename]=line.strip()
            if any(x in line.lower() for x in ["error","exception"]):
                send(chat_id, f"⚠️ `{filename}`: `{line.strip()}`")
        err = proc.stderr.readline()
        if err:
            send(chat_id, f"❌ `{filename}` stderr: `{err.strip()}`")
        if proc.poll() is not None: break
        time.sleep(0.1)
    send(chat_id, f"⏹ `{filename}` توقف.")

# ========= تثبيت مكتبات =========
def install_lib(chat_id, lib):
    send(chat_id, f"⏳ تثبيت `{lib}` ...")
    r = subprocess.run([sys.executable,"-m","pip","install",lib],capture_output=True,text=True)
    if r.returncode==0:
        send(chat_id, f"✅ تم تثبيت `{lib}`")
    else:
        send(chat_id, f"❌ خطأ:\n```\n{r.stderr[-800:]}\n```")

# ========= التعامل مع الرسائل =========
def handle_message(chat_id, text):
    if text.startswith("/install "):
        install_lib(chat_id, text.split(" ",1)[1]); return
    if text.startswith("/run "):
        run_python_file(text.split(" ",1)[1], chat_id); return
    if text.startswith("/stop "):
        stop_file(text.split(" ",1)[1]); send(chat_id,"🛑 تم الإيقاف."); return
    if text=="/files":
        fs=[f for f in os.listdir(UPLOAD_FOLDER) if f.endswith(".py")]
        send(chat_id,"📂 الملفات:\n"+"\n".join(fs) if fs else "لا ملفات.")
        return
    send(chat_id,"⚙️ الأوامر:\n/install lib\n/run file.py\n/stop file.py\n/files")

def handle_update(u):
    try:
        msg=u.get("message") or {}
        chat=msg.get("chat",{}); cid=chat.get("id")
        if "text" in msg:
            handle_message(cid, msg["text"])
        if "document" in msg:
            d=msg["document"]; fn=d.get("file_name","")
            if fn.endswith(".py"):
                send(cid,f"⬇️ تحميل `{fn}` ...")
                if download_file(d["file_id"],fn):
                    send(cid,"✅ تم الحفظ، التشغيل الآن.")
                    run_python_file(fn,cid)
                else:
                    send(cid,"❌ فشل التحميل.")
    except Exception:
        print(traceback.format_exc())

# ========= الحلقة الرئيسية =========
def main():
    print("🚀 Sifo bot بدأ العمل.")
    off=read_offset()
    while True:
        try:
            p={"timeout":LONG_POLL,"limit":100}
            if off: p["offset"]=off
            r=requests.get(GETUPDATES,params=p,timeout=LONG_POLL+5).json()
            for u in r.get("result",[]):
                off=u["update_id"]+1; write_offset(off)
                threading.Thread(target=handle_update,args=(u,),daemon=True).start()
        except Exception as e:
            print("loop error:",e)
            time.sleep(2)

def stop_all(signum=None, frame=None):
    print("🛑 إيقاف جميع العمليات.")
    for f,p in list(active_processes.items()):
        try: p.terminate()
        except: pass
    sys.exit(0)

signal.signal(signal.SIGINT, stop_all)
signal.signal(signal.SIGTERM, stop_all)

if __name__=="__main__":
    main()
