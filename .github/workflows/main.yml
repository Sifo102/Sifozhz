name: Powerful VPS Server
on:
  workflow_dispatch:
jobs:
  deploy-vps:
    runs-on: windows-latest
    timeout-minutes: 10080
    
    steps:
    - name: Configure VPS Core Settings
      run: |
        # Enable RDP and configure security
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        
        # Configure firewall for multiple ports
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        netsh advfirewall firewall add rule name="SSH-Port" dir=in action=allow protocol=TCP localport=22
        netsh advfirewall firewall add rule name="HTTP-Port" dir=in action=allow protocol=TCP localport=80
        netsh advfirewall firewall add rule name="HTTPS-Port" dir=in action=allow protocol=TCP localport=443
        netsh advfirewall firewall add rule name="FTP-Port" dir=in action=allow protocol=TCP localport=21
        netsh advfirewall firewall add rule name="Custom-1" dir=in action=allow protocol=TCP localport=8080
        netsh advfirewall firewall add rule name="Custom-2" dir=in action=allow protocol=TCP localport=8443
        
        # Enable IPv4 and IPv6
        netsh interface ipv4 set global rss=enabled
        netsh interface ipv6 set global rss=enabled
        
        # Optimize network performance
        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global rss=enabled
        netsh int tcp set global chimney=enabled
        
        Restart-Service -Name TermService -Force
        Write-Host "✅ VPS Core configuration completed"

    - name: Create Admin User Account
      run: |
        $username = "VPS-Admin"
        $password = "SecurePass123!"
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        # Remove existing user if any
        Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 3
        
        # Create new admin user
        New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member $username
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
        Add-LocalGroupMember -Group "Remote Management Users" -Member $username
        Enable-LocalUser -Name $username
        
        echo "VPS_USERNAME=$username" >> $env:GITHUB_ENV
        echo "VPS_PASSWORD=$password" >> $env:GITHUB_ENV
        Write-Host "✅ Admin user created: $username"

    - name: Install and Configure SSH Server
      run: |
        # Install OpenSSH Server using Windows Optional Features
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
        
        # Start and configure SSH service
        Start-Service sshd
        Set-Service -Name sshd -StartupType 'Automatic'
        
        # Configure SSH to allow password authentication
        $sshdConfig = @"
Port 22
Protocol 2
HostKey __PROGRAMDATA__/ssh/ssh_host_rsa_key
HostKey __PROGRAMDATA__/ssh/ssh_host_dsa_key
HostKey __PROGRAMDATA__/ssh/ssh_host_ecdsa_key
HostKey __PROGRAMDATA__/ssh/ssh_host_ed25519_key
AuthorizedKeysFile	.ssh/authorized_keys
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
Subsystem	sftp	sftp-server.exe
"@
        
        Set-Content -Path "$env:ProgramData\ssh\sshd_config" -Value $sshdConfig -Force
        
        # Restart SSH service
        Restart-Service sshd
        Write-Host "✅ SSH Server installed and configured on port 22"

    - name: Install Web Server (IIS)
      run: |
        # Install IIS with all features
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServer -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-CommonHttpFeatures -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-HttpErrors -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-HttpRedirect -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-ApplicationDevelopment -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-Security -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-RequestFiltering -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-Performance -All
        Enable-WindowsOptionalFeature -Online -FeatureName IIS-WebServerManagementTools -All
        
        # Start IIS
        Start-Service -Name W3SVC
        Set-Service -Name W3SVC -StartupType Automatic
        
        # Create advanced VPS info page
        $htmlContent = @"
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerful VPS Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            min-height: 100vh;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 40px 20px; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 50px; 
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 { 
            font-size: 3em; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .stat-card { 
            background: rgba(255,255,255,0.15); 
            padding: 25px; 
            border-radius: 10px; 
            text-align: center;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card h3 { 
            font-size: 1.2em; 
            margin-bottom: 15px; 
            color: #ffd700;
        }
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px; 
        }
        .service-item { 
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center;
            border-left: 4px solid #4CAF50;
        }
        .connection-info {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Powerful VPS Server</h1>
            <p>Enterprise-grade Virtual Private Server</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>💾 Storage</h3>
                <p>32GB SSD Storage</p>
            </div>
            <div class="stat-card">
                <h3>🧠 Memory</h3>
                <p>3GB RAM</p>
            </div>
            <div class="stat-card">
                <h3>🔧 Processor</h3>
                <p>High-performance CPU</p>
            </div>
            <div class="stat-card">
                <h3>🌐 Network</h3>
                <p>Dual-stack IPv4/IPv6</p>
            </div>
        </div>

        <div class="connection-info">
            <h2 style="text-align: center; margin-bottom: 20px;">🔗 Connection Information</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <div class="service-item">
                    <strong>SSH Access</strong><br>
                    Port: 22<br>
                    Username: VPS-Admin
                </div>
                <div class="service-item">
                    <strong>RDP Access</strong><br>
                    Port: 3389<br>
                    Username: VPS-Admin
                </div>
                <div class="service-item">
                    <strong>Web Server</strong><br>
                    Port: 80/443<br>
                    Status: Running
                </div>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <p><strong>⚡ Powered by GitHub Actions | 🕐 Duration: 7 Days</strong></p>
        </div>
    </div>
</body>
</html>
"@
        Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value $htmlContent -Force
        Write-Host "✅ Web Server installed with advanced dashboard"

    - name: Install Development Tools
      run: |
        # Install Chocolatey package manager
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Refresh environment
        refreshenv
        
        # Install essential development tools
        choco install git -y --force
        choco install nodejs -y --force
        choco install python -y --force
        choco install vscode -y --force
        choco install curl -y --force
        choco install 7zip -y --force
        choco install wget -y --force
        
        Write-Host "✅ Development tools installed successfully"

    - name: Optimize System Performance
      run: |
        # Set high performance power plan
        powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
        
        # Disable power saving features
        powercfg -change -standby-timeout-ac 0
        powercfg -change -hibernate-timeout-ac 0
        powercfg -change -monitor-timeout-ac 0
        
        # Optimize virtual memory
        $computerSystem = Get-WmiObject -Class Win32_ComputerSystem
        $totalPhysicalMemory = [math]::Round($computerSystem.TotalPhysicalMemory / 1MB)
        $initialSize = [math]::Round($totalPhysicalMemory * 1.5)
        $maximumSize = [math]::Round($totalPhysicalMemory * 3)
        
        $pageFileSettings = Get-WmiObject -Class Win32_PageFileSetting
        if ($pageFileSettings) {
            $pageFileSettings.InitialSize = $initialSize
            $pageFileSettings.MaximumSize = $maximumSize
            $pageFileSettings.Put()
        }
        
        # Optimize network performance
        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global rss=enabled
        netsh int tcp set global netdma=enabled
        
        Write-Host "✅ System performance optimized"

    - name: Configure Storage and Monitoring
      run: |
        # Create multiple storage directories
        $directories = @("C:\VPS-Data", "C:\VPS-Logs", "C:\VPS-Backups", "C:\VPS-Apps")
        foreach ($dir in $directories) {
            New-Item -ItemType Directory -Path $dir -Force
        }
        
        # Create storage info file
        $storageInfo = @"
VPS Storage Configuration:
- Total Available: 32GB
- System Drive: C:\
- Data Directory: C:\VPS-Data\
- Logs Directory: C:\VPS-Logs\
- Backups Directory: C:\VPS-Backups\
- Applications: C:\VPS-Apps\

Storage Status: Optimal
Last Updated: $(Get-Date)
"@
        Set-Content -Path "C:\VPS-Data\storage-info.txt" -Value $storageInfo
        
        Write-Host "✅ Storage configured and optimized"

    - name: Get Network Information
      run: |
        # Get public IP address
        try {
            $publicIP = Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10
            echo "PUBLIC_IP=$publicIP" >> $env:GITHUB_ENV
            Write-Host "🌍 Public IPv4: $publicIP"
        } catch {
            Write-Host "⚠️ Could not get public IP"
            echo "PUBLIC_IP=Dynamic" >> $env:GITHUB_ENV
        }
        
        # Get system information
        $systemInfo = Get-ComputerInfo
        $memoryGB = [math]::Round($systemInfo.CsTotalPhysicalMemory / 1GB, 1)
        $osVersion = $systemInfo.WindowsVersion
        $processor = $systemInfo.CsProcessors[0].Name
        
        echo "SYSTEM_RAM=${memoryGB}GB" >> $env:GITHUB_ENV
        echo "OS_VERSION=$osVersion" >> $env:GITHUB_ENV
        echo "PROCESSOR=$processor" >> $env:GITHUB_ENV
        
        Write-Host "💻 System RAM: ${memoryGB}GB"
        Write-Host "🖥️ Processor: $processor"

    - name: Display VPS Connection Information
      run: |
        Write-Host ""
        Write-Host "🎯 ==================== POWERFUL VPS SERVER ===================="
        Write-Host ""
        Write-Host "🔐 LOGIN CREDENTIALS:"
        Write-Host "   👤 Username: $env:VPS_USERNAME"
        Write-Host "   🔑 Password: $env:VPS_PASSWORD"
        Write-Host ""
        Write-Host "🌐 CONNECTION METHODS:"
        Write-Host "   📡 SSH Access:     $env:PUBLIC_IP:22"
        Write-Host "   🖥️ RDP Access:     $env:PUBLIC_IP:3389"
        Write-Host "   🌐 Web Server:     http://$env:PUBLIC_IP"
        Write-Host "   🔗 HTTPS:          https://$env:PUBLIC_IP"
        Write-Host ""
        Write-Host "💾 SYSTEM SPECIFICATIONS:"
        Write-Host "   🧠 RAM: $env:SYSTEM_RAM"
        Write-Host "   💽 Storage: 32GB Available"
        Write-Host "   🔧 Processor: $env:PROCESSOR"
        Write-Host "   🖥️ OS: Windows Server $env:OS_VERSION"
        Write-Host ""
        Write-Host "⚙️ INSTALLED SERVICES:"
        Write-Host "   ✅ SSH Server (Port 22)"
        Write-Host "   ✅ Web Server (IIS)"
        Write-Host "   ✅ RDP Server (Port 3389)"
        Write-Host "   ✅ FTP Server (Port 21)"
        Write-Host "   ✅ Development Tools"
        Write-Host ""
        Write-Host "🔧 DEVELOPMENT TOOLS:"
        Write-Host "   • Git, Node.js, Python"
        Write-Host "   • VS Code, Curl, 7-Zip"
        Write-Host "   • Web Server with Dashboard"
        Write-Host ""
        Write-Host "⏰ DURATION: 7 DAYS"
        Write-Host "================================================================"
        Write-Host ""

    - name: Maintain VPS Services
      run: |
        $startTime = Get-Date
        Write-Host "🔄 Powerful VPS Server is now running..."
        
        while ($true) {
            $currentTime = Get-Date
            $elapsed = $currentTime - $startTime
            $hours = [math]::Round($elapsed.TotalHours, 1)
            
            # Monitor critical services
            $services = @(
                @{Name="TermService"; Description="RDP Service"},
                @{Name="sshd"; Description="SSH Service"},
                @{Name="W3SVC"; Description="Web Service"}
            )
            
            foreach ($service in $services) {
                $svc = Get-Service -Name $service.Name -ErrorAction SilentlyContinue
                if ($svc -and $svc.Status -ne 'Running') {
                    Write-Host "🔄 Restarting $($service.Description)..."
                    Start-Service -Name $service.Name
                }
            }
            
            # Display status every 5 minutes
            if ((Get-Date).Minute % 5 -eq 0) {
                Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] ✅ VPS Active - $hours hours"
                Write-Host "   🌐 SSH: $env:PUBLIC_IP:22 | RDP: $env:PUBLIC_IP:3389"
                Write-Host "   👤 User: $env:VPS_USERNAME | 💾 Storage: 32GB"
            }
            
            Start-Sleep -Seconds 60
        }
