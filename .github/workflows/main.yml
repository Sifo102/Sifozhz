name: VPS-SSH
on:
  workflow_dispatch:

jobs:
  configure-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Show header
        run: |
          echo "=== Configure VPS for SSH (port 22) ==="

      - name: Update & install OpenSSH and UFW
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server ufw curl

      - name: Ensure sshd runtime dir exists and set basic config
        run: |
          sudo mkdir -p /var/run/sshd
          # Ensure sshd listens on port 22 and allow password auth (we'll restart later)
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak || true
          sudo sed -i 's/^#\?Port .*/Port 22/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

      - name: Create SSH user and set password
        env:
          SSH_USER: TOOLBOXLAP
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          USER="${SSH_USER:-TOOLBOXLAP}"
          PASS="${SSH_PASS:-admin@123}"
          echo "Creating user: $USER"
          # create user if not exists
          if ! id -u "$USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USER"
            # add to sudoers
            sudo usermod -aG sudo "$USER"
          fi
          # set password (chpasswd expects "user:pass")
          echo "${USER}:${PASS}" | sudo chpasswd
          # force password change disabled (account never expires)
          sudo chage -M -1 "$USER" || true
          # export credentials into job summary and environment for later steps
          echo "SSH_USER=${USER}" >> $GITHUB_ENV
          echo "SSH_PASS_SET=1" >> $GITHUB_ENV
          # Do not print the password in logs except in a controlled place later if you want.
          echo "User ${USER} created/ensured."

      - name: Open firewall port 22 (UFW) and allow SSH
        run: |
          # configure UFW non-interactively
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      - name: Restart sshd
        run: |
          sudo systemctl restart ssh || sudo service ssh restart
          sleep 2
          sudo systemctl status ssh --no-pager || sudo service ssh status

      - name: Get public IP and verify SSH port reachable
        run: |
          # fetch public IP
          PUBLIC_IP="$(curl -s https://api.ipify.org)"
          if [ -z "$PUBLIC_IP" ]; then
            PUBLIC_IP="$(curl -s https://ifconfig.me || true)"
          fi
          if [ -z "$PUBLIC_IP" ]; then
            echo "ERROR: Could not determine public IP address."
            exit 1
          fi
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          echo "Public IP: $PUBLIC_IP"

          # quick test: check if port 22 open locally and remotely (if NAT/public)
          echo "Checking local SSH port (22)..."
          ss -tlnp | grep ':22 ' || true
          echo "Attempting TCP connection test to $PUBLIC_IP:22 (may fail on GH runners behind NAT)..."
          # Use netcat if available, otherwise attempt bash /dev/tcp
          if command -v nc >/dev/null 2>&1; then
            nc -z -w 5 "$PUBLIC_IP" 22 && echo "TCP to $PUBLIC_IP:22 succeeded" || echo "TCP to $PUBLIC_IP:22 failed or blocked"
          else
            (timeout 5 bash -c "cat < /dev/null > /dev/tcp/$PUBLIC_IP/22") && echo "TCP to $PUBLIC_IP:22 succeeded" || echo "TCP to $PUBLIC_IP:22 failed or blocked"
          fi

      - name: Output Termux connection info (visible in logs)
        run: |
          USER="${SSH_USER:-TOOLBOXLAP}"
          PUBLIC_IP="${PUBLIC_IP:-$(curl -s https://api.ipify.org)}"
          PASS="${{ secrets.SSH_PASSWORD }}"
          # fallback to default if secret not set (do not expose secret variable directly)
          if [ -z "$PASS" ]; then
            PASS="admin@123"
          fi

          echo
          echo "=== SSH ACCESS INFO ==="
          echo "Host (Public IP): $PUBLIC_IP"
          echo "Port: 22"
          echo "User: $USER"
          echo "Password: (the password you set in Actions secret SSH_PASSWORD or default admin@123)"
          echo
          echo "To connect from Termux on your Android device, run:"
          echo "ssh ${USER}@${PUBLIC_IP} -p 22"
          echo
          echo "If you prefer key-based auth (recommended):"
          echo "1) Generate key on Termux: ssh-keygen -t ed25519"
          echo "2) Copy public key to server (replace /home/${USER}/.ssh/authorized_keys):"
          echo "   scp ~/.ssh/id_ed25519.pub ${USER}@${PUBLIC_IP}:/tmp/pubkey"
          echo "   ssh ${USER}@${PUBLIC_IP} 'mkdir -p ~/.ssh && cat /tmp/pubkey >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys && rm /tmp/pubkey'"
          echo "========================"

      - name: Keep workflow alive for manual testing (optional)
        if: ${{ always() }}
        run: |
          echo "Workflow finished configuration. If you want the job to keep running (so runner stays up), uncomment the loop below."
          # NOTE: GitHub-hosted runners are ephemeral. Keeping the job alive does NOT give you a permanent VPS.
          # Uncomment the following lines only if you intentionally want to keep this workflow job running for some time:
          #
          # while true; do
          #   echo "[$(date)] runner alive - press ctrl+c in logs to stop"
          #   sleep 300
          # done
